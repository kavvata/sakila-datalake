# Catalogo Iceberg sobre o Nessie: metadados versionados no Nessie (mesma
# URI/branch/warehouse dos jobs Spark, ver dags/utils/dev_spark_run.sh) e
# dados no MinIO (s3://warehouse).
# ${ENV:VAR} e resolvido pelo proprio Trino a partir das variaveis passadas
# no service trino do docker-compose.yml (nao pelo compose).
connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse
iceberg.nessie-catalog.ref=dev
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.path-style-access=true
s3.endpoint=http://minio:9000
s3.region=us-east-2
s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
