# single node standalone: coordinator e worker no mesmo processo
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://127.0.0.1:8080
# heap da imagem e 1G (jvm.config padrao em /usr/lib/trino/etc); limites de
# query consistentes com ele
query.max-memory=512MB
query.max-memory-per-node=256MB
