apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: extrai-sakila-bronze
  namespace: airflow
spec:
  type: pysql
  mode: client
  image: unidata-spark:4.1.2
  sparkVersion: "4.1.2"
  mainApplicationFile: local:///opt/spark/scripts/bronze/extrai_sakila_bronze.py
  driver:
    cores: 1
    memory: 2g
  executor:
    cores: 1
    memory: 2g
    instances: 1
