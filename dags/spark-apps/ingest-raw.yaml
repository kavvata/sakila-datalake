apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: ingest-raw
  namespace: airflow
spec:
  type: pysql
  mode: client
  image: unidata-spark:4.1.2
  sparkVersion: "4.1.2"
  mainApplicationFile: local:///opt/spark/scripts/00_bronze/ingest_raw.py
  driver:
    cores: 1
    memory: 512m
  executor:
    cores: 1
    memory: 512m
    instances: 1
