apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: cria-namespace-gold
  namespace: airflow
spec:
  type: pysql
  mode: client
  image: unidata-spark:4.1.2
  sparkVersion: "4.1.2"
  mainApplicationFile: local:///opt/spark/scripts/gold/cria_namespace_gold.py
  driver:
    cores: 1
    memory: 2g
  executor:
    cores: 1
    memory: 2g
    instances: 1
