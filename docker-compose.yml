services:
  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: unidata_airflow
    user: root
    environment:
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS=${AIRFLOW_ADMIN_USER:-airflow}:admin
      - PIPELINE_ENV=dev
      - HOME=/home/airflow
      - UNIDATA_REPO_DIR=/opt/spark/work-dir
      # rede default do compose project; o job Spark resolve nessie/minio/
      # postgres por nome de servico (ver dags/utils/dev_spark_run.sh)
      - SPARK_JOB_NETWORK=datalake-example_default
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - .:/opt/spark/work-dir
      - ./docker/airflow/entrypoint.sh:/entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /entrypoint.sh
    command:
      - -c
      - |
        set -e
        airflow db migrate
        PW_FILE="/opt/airflow/simple_auth_manager_passwords.json.generated"
        if [ ! -f "$$PW_FILE" ]; then
          printf '{"%s": "%s"}\n' "${AIRFLOW_ADMIN_USER:-airflow}" "${AIRFLOW_ADMIN_PASSWORD:-airflow}" > "$$PW_FILE"
        fi
        exec airflow standalone
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8080/health/livez || exit 1"]
      interval: 30s
      retries: 5
      start_period: 90s

  jupyter:
    image: unidata-jupyter:4.1.2
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    container_name: unidata_jupyter
    ports:
      - "127.0.0.1:8888:8888"
    working_dir: /opt/spark/work-dir
    volumes:
      - .:/opt/spark/work-dir
      - ./scripts:/opt/spark/scripts
    user: "1000:1000"
    env_file: .env
    environment:
      - HOME=/home/jupyter
      - PYTHONPATH=/opt/spark/scripts:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip
    depends_on:
      postgres:
        condition: service_healthy
      nessie:
        condition: service_healthy
      create-warehouse:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/api || exit 1"]
      interval: 30s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16
    container_name: unidata_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sakila}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # demo local: auth host em trust para evitar o quarkus do Nessie ter que
      # injetar senha no datasource
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 00-* roda antes do init do DB: cria o user/DB do Nessie; reusa este
      # container para manter o stack leve
      - ./docker/postgres/00-create-nessie.sql:/docker-entrypoint-initdb.d/00-create-nessie.sql:ro
      - ./docker/postgres/postgres-sakila-schema.sql:/docker-entrypoint-initdb.d/10-sakila-schema.sql:ro
      - ./docker/postgres/postgres-sakila-insert-data.sql:/docker-entrypoint-initdb.d/20-sakila-data.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sakila} || exit 1",
        ]
      interval: 10s
      retries: 5
      start_period: 15s

  # single-node; mesma imagem/tag do k8s (quay.io/minio/minio tornou-se
  # privado no pull 401, por isso o mirror comunitario pgsty/minio)
  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-02-14T12-00-00Z
    container_name: unidata_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-unidata}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-supersenha}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    # a imagem nao tem curl/wget/mc; bash /dev/tcp e o probe disponivel
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      retries: 5
      start_period: 15s

  # cria o bucket do warehouse no boot; --ignore-existing + || true deixam
  # o boot idempotente
  create-warehouse:
    image: docker.io/pgsty/mc:RELEASE.2026-03-13T08-57-32Z
    container_name: unidata_create_warehouse
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: sh -c "bash -c 'until exec 3</dev/tcp/minio/9000 2>/dev/null; do sleep 2; done' && mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-unidata} ${MINIO_SECRET_KEY:-supersenha} && mc mb --ignore-existing local/warehouse || true"

  nessie:
    image: ghcr.io/projectnessie/nessie:0.109.0
    container_name: unidata_nessie
    depends_on:
      postgres:
        condition: service_healthy
      create-warehouse:
        condition: service_completed_successfully
    environment:
      # store JDBC + datasource nomeado 'postgresql' (o chart deriva o nome
      # do datasource do scheme da URL — ver nessie.dbKind). Com host em
      # trust (demo) nao precisa de senha; user vai na URL.
      - QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL=jdbc:postgresql://postgres:5432/nessie-postgres?user=nessie
      - NESSIE_VERSION_STORE_TYPE=JDBC
      - NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE=postgresql
      - NESSIE_SERVER_DEFAULT_BRANCH=dev
    ports:
      - "127.0.0.1:19120:19120"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:19120/api/v1/config || exit 1",
        ]
      interval: 15s
      retries: 10
      start_period: 90s

  # Dremio CE; UI/REST na 9047, JDBC (direct protocol) na 31010
  dremio:
    image: dremio/dremio-oss:26.0.5
    container_name: enidata_dremio
    ports:
      - "127.0.0.1:9047:9047"
      - "127.0.0.1:31010:31010"
    volumes:
      - dremio_data:/opt/dremio/data
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9047/ || exit 1"]
      interval: 15s
      retries: 20
      start_period: 120s

  # Trino standalone (coordinator + worker); le as tabelas Iceberg do
  # warehouse pelo catalog Nessie — mesma URI/branch/warehouse dos jobs
  # Spark (ver dags/utils/dev_spark_run.sh). UI/CLI no 8081 do host.
  # O etc/ local substitui o default da imagem; as chaves S3 sao injetadas
  # como env (o catalogo usa ${ENV:}, resolvido pelo proprio Trino).
  trino:
    image: trinodb/trino:483
    container_name: unidata_trino
    # sem limite, o MaxRAMPercentage=80 do jvm.config da imagem pegaria 80%
    # da RAM do host (6G); 2G -> heap ~1.6G, suficiente p/ dev
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-unidata}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-supersenha}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    # /v1/info soa 503 ate o server subir (mesma imagem ja tem curl)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info || exit 1"]
      interval: 15s
      retries: 10
      start_period: 60s

  metabase:
    image: unidata-metabase:4.1.2
    build:
      context: .
      dockerfile: docker/metabase/Dockerfile
    container_name: unidata_metabase
    environment:
      # H2 fica dentro do volume /metabase/data (padrao seria /metabase.db,
      # que e layer efemera do container -> setup zerava a cada recriacao)
      - MB_DB_FILE=/metabase/data/metabase.db
      # rede do compose e privada (192.168.x): sem isso tanto o test/health do
      # datasource (warehouse) quanto a configuracao de provider AI (LLM) sao
      # bloqueados ("network Metabase is not allowed to connect to").
      # allow-private = publicas + privadas, sem loopback/link-local.
      - MB_WAREHOUSE_ALLOWED_NETWORKS=allow-private
      - MB_LLM_ALLOWED_NETWORKS=allow-private
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - metabase_data:/metabase/data

  # registra o secret S3 (MinIO) no boot; o PUT re-executa sem efeito colateral
  # e || true deixa o boot idempotente
  dremio-secret:
    image: dremio/dremio-oss:26.0.5
    container_name: unidata_dremio_secret
    depends_on:
      dremio:
        condition: service_healthy
    entrypoint:
      [
        "sh",
        "-c",
        'curl -fsS -X PUT -H ''Content-Type: application/json'' -d ''{"id":{"name":"s3","type":"remote_s3"},"properties":{"endpoint-url":{"value":"${MINIO_ENDPOINT:-http://minio:9000}"},"access-key":{"value":"${MINIO_ACCESS_KEY:-unidata}"},"secret-key":{"value":"${MINIO_SECRET_KEY:-supersenha}"}}}'' http://dremio:9047/api/v3/secrets/s3 || true',
      ]

volumes:
  airflow_home:
  postgres_data:
  minio_data:
  dremio_data:
  metabase_data:
