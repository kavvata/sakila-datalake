[project]
name = "datalake-example"
version = "0.1.0"
description = "Example project for a ELT pipeline using Airflow and Spark."
readme = "README.md"
authors = [
    { name = "kavvata", email = "gabriel.kawata@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apache-airflow>=3.3.2",
    "pyspark>=4.2.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "pyyaml>=6.0.3",
    "websocket-client>=1.9.0",
]

[tool.ty.environment]
extra-paths = ["./scripts"]
